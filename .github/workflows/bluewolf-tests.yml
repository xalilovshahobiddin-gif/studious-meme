name: Blue Wolf tests

on:
  pull_request:
    paths: ['bluewolf/**', '.github/workflows/bluewolf-tests.yml']
  push:
    branches: [main]
    paths: ['bluewolf/**', '.github/workflows/bluewolf-tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bluewolf
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test
      - name: JavaScript tests (oʻyin formulalari)
        run: node tests/js/game.test.js
