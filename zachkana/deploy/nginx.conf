# zachkana.uz — Nginx namunasi (VPS uchun)
server {
    listen 80;
    server_name zachkana.uz www.zachkana.uz;
    root /var/www/zachkana/public;

    index index.html index.php;
    client_max_body_size 12m;   # fayl yuklash (10 MB) uchun

    location = /sw.js              { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html         { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
