<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zachkana — qishloq sayti</title>
<meta name="description" content="Zachkana qishlogʻining raqamli xotirasi: shajara, tarix, xronologiya, faxriylar va qishloqdoshlar suhbati.">
<meta name="theme-color" content="#faf5ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zachkana">
<meta property="og:title" content="Zachkana — qishloq sayti">
<meta property="og:description" content="Shajara, tarix, faxriylar va qishloq suhbati bir joyda.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="ui/zachkana-ui.css">
<link rel="stylesheet" href="css/app.css">
<script>
  /* Mavzuni sahifa chizilishidan oldin qoʻllash (miltillamasligi uchun) */
  try { var t = localStorage.getItem('zk-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>

<a class="skip-link" href="#view">Asosiy mazmunga oʻtish</a>

<!-- Yon panel: katta ekranlar (web) -->
<aside class="z-sidebar app-sidebar" aria-label="Asosiy menyu">
  <a class="z-logo" href="#/" aria-label="Zachkana bosh sahifa">
    <img class="z-logo__mark" src="assets/logo-mark.svg" alt="">
    <span class="z-logo__text">Zachkana<small>Qishloq sayti</small></span>
  </a>
  <nav class="z-nav" id="sideNav"></nav>
  <div class="sidebar-foot">
    <button class="z-btn z-btn--soft z-btn--block install-btn" data-action="install" hidden></button>
    <div class="sidebar-user" id="sideUser"></div>
  </div>
</aside>

<div class="app-main">
  <!-- Yuqori panel -->
  <header class="z-appbar" id="appbar">
    <a class="z-logo appbar-logo" href="#/" aria-label="Zachkana bosh sahifa">
      <img class="z-logo__mark" src="assets/logo-mark.svg" alt="">
      <span class="z-logo__text">Zachkana</span>
    </a>
    <button class="z-btn z-btn--ghost z-btn--icon appbar-back" data-action="back" aria-label="Orqaga" hidden></button>
    <div class="z-appbar__title" id="appbarTitle"></div>
    <div class="appbar-actions" id="appbarActions"></div>
  </header>

  <div class="net-banner" id="netBanner" role="status" hidden></div>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<!-- Pastki tab panel: telefon (wap) -->
<nav class="z-tabbar app-tabbar" id="tabbar" aria-label="Asosiy boʻlimlar"></nav>

<!-- Varaq (sheet) va bildirishnomalar -->
<div class="z-scrim" id="scrim" hidden></div>
<section class="z-sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
<div class="z-toast-region" id="toasts" aria-live="polite"></div>

<script src="ui/zachkana-icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
