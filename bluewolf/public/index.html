<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Blue Wolf</title>
  <meta name="description" content="Blue Wolf — Telegram Mini App strategiya oʻyini: ov qil, in qur, toʻda yigʻ, Koʻk Boʻriga aylan.">
  <meta name="theme-color" content="#0a1222">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="ui/bluewolf-ui.css?v=0.0.13">
  <link rel="stylesheet" href="css/app.css?v=0.0.13">
  <!-- Telegram Mini App SDK: Telegram ichida initData, mavzu, BackButton beradi; brauzerda zararsiz -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bw-body">
  <!-- Yuklanish ekrani -->
  <div class="splash" id="splash" aria-live="polite">
    <img src="icons/icon.svg" alt="" class="splash__logo" width="96" height="96">
    <div class="splash__title">Blue Wolf</div>
    <div class="splash__sub">Toʻda yigʻilmoqda…</div>
    <div class="bw-progress bw-progress--sm splash__bar"><div class="bw-progress__bar" id="splash-bar" style="width:15%"></div></div>
  </div>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar__player">
        <button class="bw-avatar bw-avatar--sm bw-tier-1" id="top-avatar" type="button" aria-label="Profil"></button>
        <div class="bw-grow">
          <div class="bw-between">
            <span class="topbar__who">
              <strong class="topbar__name" id="top-name">—</strong>
              <span class="bw-chip bw-chip--primary" id="top-level">1-d.</span>
            </span>
            <button class="bw-gem" id="top-gem" type="button" data-res="moonstone" aria-label="Oy toshi">
              <svg class="bw-icon"><use href="#bw-i-moonstone"/></svg><span id="top-gem-val">0</span>
              <span class="bw-gem__plus"><svg class="bw-icon"><use href="#bw-i-plus"/></svg></span>
            </button>
          </div>
          <div class="topbar__xp">
            <div class="bw-progress bw-progress--sm bw-grow"><div class="bw-progress__bar" id="top-xp-bar" style="width:0"></div></div>
            <span class="bw-faint topbar__xp-text" id="top-xp">0 / 30 XP</span>
          </div>
        </div>
      </div>
      <div class="bw-resgrid" id="res-bar" aria-label="Resurslar — batafsil maʼlumot uchun bosing"></div>
      <!-- Taymerlar: faqat qurilish yoki mashq ketayotganda koʻrinadi -->
      <div class="timerbar" id="timer-bar" aria-label="Taymerlar" hidden></div>
      <div class="bw-banner topbar__demo" id="demo-banner" hidden></div>
    </header>

    <main class="screen" id="screen" tabindex="-1"></main>

    <nav class="bw-tabbar" aria-label="Asosiy boʻlimlar">
      <a class="bw-tab" href="#/in" data-tab="in"><svg class="bw-icon"><use href="#bw-i-den"/></svg>In</a>
      <a class="bw-tab" href="#/ov" data-tab="ov"><svg class="bw-icon"><use href="#bw-i-paw"/></svg>Ov<span class="bw-badge bw-badge--dot" id="hunt-badge" hidden></span></a>
      <a class="bw-tab" href="#/jang" data-tab="jang"><svg class="bw-icon"><use href="#bw-i-swords"/></svg>Jang</a>
      <a class="bw-tab" href="#/toda" data-tab="toda"><svg class="bw-icon"><use href="#bw-i-wolfpack"/></svg>Toʻda</a>
      <a class="bw-tab" href="#/vazifalar" data-tab="vazifalar"><svg class="bw-icon"><use href="#bw-i-quest"/></svg>Vazifalar<span class="bw-badge" id="quest-badge" hidden></span></a>
      <a class="bw-tab" href="#/profil" data-tab="profil"><svg class="bw-icon"><use href="#bw-i-wolfid"/></svg>Profil</a>
    </nav>
  </div>

  <div class="bw-sheet-backdrop" id="sheet-backdrop"></div>
  <section class="bw-sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="bw-sheet__grip"></div>
    <div id="sheet-body"></div>
  </section>
  <!-- Chap menyu -->
  <div class="drawer-backdrop" id="drawer-backdrop" data-action="menu-close"></div>
  <button class="drawer-handle" id="menu-btn" type="button" data-action="menu-toggle" aria-label="Menyu" aria-controls="drawer" aria-expanded="false"><svg class="bw-icon"><use href="#bw-i-chevron"/></svg></button>
  <nav class="drawer" id="drawer" aria-label="Menyu" aria-hidden="true" inert>
    <div class="drawer__head">
      <span class="drawer__brand"><svg class="bw-icon"><use href="#bw-i-wolf"/></svg>Blue Wolf</span>
      <button class="bw-btn bw-btn--ghost bw-btn--icon bw-btn--sm drawer__close" type="button" data-action="menu-close" aria-label="Menyuni yopish"><svg class="bw-icon"><use href="#bw-i-close"/></svg></button>
    </div>
    <div class="drawer__body" id="drawer-body"></div>
  </nav>
  <!-- Tanishtiruv yoʻriqchisi -->
  <aside class="coach" id="coach" aria-live="polite" hidden></aside>
  <div class="bw-toast-host" id="toasts" aria-live="polite"></div>

  <script src="ui/bluewolf-icons.js?v=0.0.13"></script>
  <script src="js/demo-data.js?v=0.0.13"></script>
  <script src="js/game.js?v=0.0.13"></script>
  <script src="js/api.js?v=0.0.13"></script>
  <script src="js/app.js?v=0.0.13"></script>
</body>
</html>
